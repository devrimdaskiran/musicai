name: MUSİCAİ üretim

on:
  schedule:
    # Haftada 2 şarkı: Salı ve Cuma ~16:20 (TR). CPU'da üretim ~40-60 dk; şarkı akşamdan önce Telegram'a düşer.
    - cron: "20 13 * * 2,5"
  workflow_dispatch:
    inputs:
      style:
        description: "Tarz kimliği (boş = otomatik). Örn: anadolu-rock-70s, slap-house, akustik-pop, phonk"
        default: ""
      auto:
        description: "Otomatik mod (yedek tetik kullanır; elle çalıştırırken boş bırak)"
        default: ""
      lm:
        description: "ACE-Step dil modeli: 0.6B (önerilen), 1.7B (çok yavaş, saatler sürebilir) ya da none (en hızlı)"
        default: "0.6B"

permissions:
  contents: write

concurrency:
  group: musicai-produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # gecikmeli çalışmalar da en güncel hafızayı görsün

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sistem paketleri
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Disk aç (modeller ~11 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Takas alanı (büyük model için RAM yedeği)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile && free -h

      - name: ACE-Step kur
        run: |
          pip install -q -r requirements.txt
          bash scripts/setup_ace.sh

      - name: Şarkı üret ve Telegram'a gönder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ secrets.ZERNIO_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          ACESTEP_DIR: ace
          MUSICAI_STYLE: ${{ github.event.inputs.style || '' }}
          MUSICAI_LM: ${{ github.event.inputs.lm || '0.6B' }}
          MUSICAI_AUTO: ${{ (github.event_name == 'schedule' || github.event.inputs.auto == '1') && '1' || '' }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python -m musicai.main

      - name: Çıktıları sakla (3 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicai-${{ github.run_id }}
          path: |
            out/**/*.mp3
            out/**/*.mp4
            out/**/*.jpg
            out/**/*.txt
            out/**/*.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Hafızayı kaydet
        if: always()
        run: |
          git config user.name "musicai-bot"
          git config user.email "musicai-bot@users.noreply.github.com"
          git add -A state data/queue.json
          git diff --cached --quiet || git commit -m "Üretim: $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 8 + 3)); done
