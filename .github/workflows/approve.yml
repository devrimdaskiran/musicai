name: MUSİCAİ onay

# Telegram'daki "Yayınla / Atla" butonlarını gün içinde saatte bir işler (~10:05–01:05 TR).
on:
  schedule:
    - cron: "5 7-22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: musicai-approve
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # gecikmeli çalışmalar da en güncel hafızayı görsün
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Butonları işle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ secrets.ZERNIO_ACCOUNT_ID }}
        run: python -m musicai.approve
      - name: Kaçan üretim var mı? (yedek tetik)
        id: catchup
        run: python -m musicai.catchup
      - name: Kaçan üretimi başlat
        if: steps.catchup.outputs.result == 'run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow produce.yml --limit 5 --json status \
                 --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" = "0" ]; then
            gh workflow run produce.yml -R "$GITHUB_REPOSITORY" --ref main -f auto=1
            echo "Üretim yedek tetikle başlatıldı"
          else
            echo "Üretim zaten çalışıyor"
          fi
      - name: Hafızayı kaydet
        if: always()
        run: |
          git config user.name "musicai-bot"
          git config user.email "musicai-bot@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet || git commit -m "Onay: $(date -u +'%F %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 8 + 3)); done
